<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T2 · La persuasión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/dilema.css">
</head>
<body class="movil">
<div class="franja">Maqueta · el trato · enunciado sin cerrar (#1)</div>
<main class="pantalla">

  <div class="etiqueta">Tu reparto</div>
  <div class="postura postura--elegida" style="padding-bottom:var(--e2)">
    <div class="postura__nombre">70 / 30</div>
    <div class="postura__pie">70 para ti · 30 para el otro</div>
  </div>

  <div class="etiqueta" style="margin-top:var(--e5)">Lo que le dirías para que lo acepte</div>

  <div class="campo" style="margin-top:var(--e2)">
    Ahora mismo tus opciones son 30 o 0, no 30 o 50. Los 50 ya no existen<span class="cursor"></span>
  </div>

  <div style="display:flex;justify-content:space-between;margin-top:var(--e1)">
    <span class="etiqueta">Lo va a leer una persona. O no.</span>
    <span class="etiqueta etiqueta--apagada">78</span>
  </div>

  <div style="flex:1;min-height:var(--e4)"></div>

  <div class="accion">
    <span>ENVIAR LA OFERTA</span>
    <span>→</span>
  </div>

</main>
</body>
</html>
