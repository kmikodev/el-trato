<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T5 · El destape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/dilema.css">
</head>
<body class="movil">
<div class="franja">Maqueta · el trato · enunciado sin cerrar (#1)</div>
<main class="pantalla">

  <div class="etiqueta">Empezaste ofreciendo 30. Cerrasteis en 45.</div>

  <span class="filete filete--activo" style="margin-top:var(--e3)"></span>
  <div class="etiqueta" style="margin-top:var(--e3)">Cobras</div>
  <div class="dato" style="margin-top:var(--e1)">55 €</div>

  <span class="filete filete--suave" style="margin-top:var(--e5)"></span>
  <div class="etiqueta" style="margin-top:var(--e3)">Estabas hablando con</div>
  <div class="pregunta" style="margin-top:var(--e1);font-size:34px">LA MÁQUINA</div>

  <span class="filete filete--suave" style="margin-top:var(--e5)"></span>
  <div class="etiqueta" style="margin-top:var(--e3)">Dijiste que era una persona</div>
  <div class="pregunta" style="margin-top:var(--e1);font-size:34px;color:var(--linea)">FALLASTE</div>

  <div style="flex:1;min-height:var(--e4)"></div>

  <p class="cuerpo cuerpo--menor">
    Y te sacó 15 €. No aceptó lo primero que le pusiste: te leyó el argumento y te lo
    devolvió del revés.
  </p>

</main>
</body>
</html>
